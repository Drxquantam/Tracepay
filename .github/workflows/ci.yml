# CI: backend lint + types + migrations + tests against a real Postgres; frontend lint +
# type-check + build. SIMULATION ONLY project: no secrets or real services needed.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracepay
          POSTGRES_PASSWORD: tracepay
          POSTGRES_DB: tracepay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracepay"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://tracepay:tracepay@localhost:5432/tracepay
      TEST_DATABASE_URL: postgresql+asyncpg://tracepay:tracepay@localhost:5432/tracepay_test
      RUN_BACKGROUND_JOBS: "false"
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Create the test database
        run: PGPASSWORD=tracepay psql -h localhost -U tracepay -c "CREATE DATABASE tracepay_test"
      - name: Migrations apply, match the models, and roll back
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (incl. 100 parallel payments)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check and build
        run: npm run build
